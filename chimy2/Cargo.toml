[package]
name = "chimy2"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "A from-scratch software rasterizer"

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
softbuffer = "0.4"
winit = "0.30"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "m6_raster"
harness = false

[[bin]]
name = "csm_demo"
path = "src/bin/csm_demo.rs"
