[package]
name = "pufferclone"
version = "0.1.0"
edition = "2021"

[dependencies]
bincode = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[dev-dependencies]
tempfile = "3"

[lib]
name = "pufferclone"
path = "src/lib.rs"

[[bin]]
name = "pufferclone"
path = "src/main.rs"
