name: chimy2

on:
  pull_request:
    paths:
      - chimy2/**
      - .github/workflows/chimy2.yml
  push:
    branches:
      - main
    paths:
      - chimy2/**
      - .github/workflows/chimy2.yml

jobs:
  fmt:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chimy2
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            chimy2/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('chimy2/Cargo.lock') }}
      - run: cargo fmt --check

  clippy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chimy2
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            chimy2/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('chimy2/Cargo.lock') }}
      - run: cargo clippy --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chimy2
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            chimy2/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('chimy2/Cargo.lock') }}
      - run: cargo test

  wasm-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chimy2
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            chimy2/target/
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('chimy2/Cargo.lock') }}
      - run: cargo build --release --target wasm32-unknown-unknown --lib
      - name: compare tracked wasm binary
        run: |
          generated="target/wasm32-unknown-unknown/release/chimy2.wasm"
          tracked="web/public/chimy2.wasm"
          if ! cmp --silent "$generated" "$tracked"; then
            echo "tracked wasm is out of date; run ./web/build.sh from the repository root and commit web/public/chimy2.wasm"
            exit 1
          fi

  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chimy2/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.11.0"
          cache: npm
          cache-dependency-path: chimy2/web/package-lock.json
      - run: npm ci
      - name: stash committed dist
        run: mv dist dist.committed
      - run: npm run build
      - name: compare tracked dist bundle
        run: |
          if ! diff -qr dist dist.committed >/dev/null; then
            echo "tracked dist/ is out of date; run 'npm run build' inside chimy2/web and commit the updated dist/ folder"
            diff -qr dist dist.committed || true
            exit 1
          fi
