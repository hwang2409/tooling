name: chimy2

on:
  pull_request:
    paths:
      - chimy2/**
      - .github/workflows/chimy2.yml
  push:
    branches:
      - main
    paths:
      - chimy2/**
      - .github/workflows/chimy2.yml

jobs:
  fmt:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chimy2
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            chimy2/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('chimy2/Cargo.lock') }}
      - run: cargo fmt --check

  clippy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chimy2
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            chimy2/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('chimy2/Cargo.lock') }}
      - run: cargo clippy --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chimy2
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            chimy2/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('chimy2/Cargo.lock') }}
      - run: cargo test
