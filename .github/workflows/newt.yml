name: newt

on:
  pull_request:
    paths:
      - newt/**
      - .github/workflows/newt.yml
  push:
    branches:
      - main
    paths:
      - newt/**
      - .github/workflows/newt.yml

jobs:
  fmt:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: newt
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            newt/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('newt/Cargo.lock') }}
      - run: cargo fmt --check

  clippy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: newt
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            newt/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('newt/Cargo.lock') }}
      - run: cargo clippy --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: newt
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            newt/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('newt/Cargo.lock') }}
      - run: cargo test
