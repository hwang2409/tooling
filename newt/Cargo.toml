[package]
name = "newt"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "A from-scratch rigid-body physics engine"

[lib]
crate-type = ["rlib"]

# Zero runtime dependencies. See docs/superpowers/specs/2026-08-13-newt-physics-design.md.

[features]
default = []
instrumentation = []
alloc-guard = []

[dev-dependencies]
chimy2 = { path = "../chimy2" }
winit = "0.30"

[[bench]]
name = "newt_perf"
harness = false

[[bin]]
name = "libm-gate"
path = "tools/libm_gate/src/main.rs"
