services:
  minio:
    container_name: pufferclone-minio
    image: minio/minio:RELEASE.2024-06-29T01-20-47Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - pufferclone-minio-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mc alias set local http://127.0.0.1:9000 minioadmin minioadmin
          >/dev/null 2>&1 && mc ready local
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  pufferclone-minio-data:
    name: pufferclone-minio-data

networks:
  default:
    name: pufferclone-minio-net
