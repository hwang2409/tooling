[package]
name = "gauge-query"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Prometheus-lite expression evaluation and HTTP query API"
publish = false

[dependencies]
axum = "0.8"
gauge-store = { path = "../gauge-store" }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
